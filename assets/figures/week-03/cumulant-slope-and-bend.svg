  <text x="90" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5b95" text-anchor="start" font-weight="bold">at eta = -1.5</text>
  <text x="90" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5b95" text-anchor="start">slope 0.18 = p</text>
  <text x="90" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5b95" text-anchor="start">bend 0.15 = p(1 - p)</text>
  <text x="622" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="end" font-weight="bold">at eta = 0.8</text>
  <text x="622" y="314" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="end">slope 0.69 = p</text>
  <text x="622" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="end">bend 0.21 = p(1 - p)</text>
  <text x="356" y="402" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">natural parameter eta, the log-odds of success</text>
  <text x="76" y="434" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The curve never bends downward, and its bend at a point is the variance of T there. The bend</text>
  <text x="76" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">is widest near eta = 0, where p = 0.5 and the variance is 0.25; far out in either direction</text>
  <text x="76" y="466" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the curve straightens, the variance falls toward zero, and the mean saturates.</text>
</svg>
