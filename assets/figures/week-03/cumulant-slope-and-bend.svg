<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img">
  <title>The Bernoulli cumulant function with two tangent lines</title>
  <desc>An increasing, gently curving function of the natural parameter eta, with tangent lines drawn at eta equal to minus 1.5 and eta equal to 0.8; the tangent slopes are 0.18 and 0.69, which are the matching success probabilities.</desc>
