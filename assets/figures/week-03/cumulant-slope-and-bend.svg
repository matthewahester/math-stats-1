  <text x="636" y="383" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">3</text>
  <line x1="72" y1="366" x2="76" y2="366" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
