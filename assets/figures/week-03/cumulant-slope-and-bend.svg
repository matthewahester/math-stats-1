  <text x="262.667" y="383" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-1</text>
  <line x1="356" y1="366" x2="356" y2="370" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="356" y="383" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
