<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img">
  <title>Sorting a sample of eight into its order statistics</title>
  <desc>Eight labelled observations in a top row are joined by crossing arrows to the same eight numbers arranged in increasing order in a bottom row; the largest value, 9.2, is highlighted as it moves to the last position.</desc>
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>
  <text x="360" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Sorting keeps every number and forgets every label</text>
  <text x="360" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">the sample as recorded, unit by unit</text>
  <text x="111.5" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x1</text>
  <rect x="79.5" y="88" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="111.5" y="111.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">2.6</text>
  <text x="182.5" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x2</text>
  <rect x="150.5" y="88" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="182.5" y="111.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">7.1</text>
  <text x="253.5" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x3</text>
  <rect x="221.5" y="88" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="253.5" y="111.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">4.8</text>
  <text x="324.5" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x4</text>
  <rect x="292.5" y="88" width="64" height="38" fill="#f3e3d6" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="324.5" y="111.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle">9.2</text>
  <text x="395.5" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x5</text>
  <rect x="363.5" y="88" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="395.5" y="111.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">1.3</text>
  <text x="466.5" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x6</text>
  <rect x="434.5" y="88" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="466.5" y="111.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">8.4</text>
  <text x="537.5" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x7</text>
  <rect x="505.5" y="88" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="537.5" y="111.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">5.5</text>
  <text x="608.5" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x8</text>
  <rect x="576.5" y="88" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="608.5" y="111.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3.9</text>
  <rect x="79.5" y="264" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="111.5" y="287.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">1.3</text>
  <text x="111.5" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x(1)</text>
  <rect x="150.5" y="264" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="182.5" y="287.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">2.6</text>
  <text x="182.5" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x(2)</text>
  <rect x="221.5" y="264" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="253.5" y="287.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3.9</text>
  <text x="253.5" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x(3)</text>
  <rect x="292.5" y="264" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="324.5" y="287.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">4.8</text>
  <text x="324.5" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x(4)</text>
  <rect x="363.5" y="264" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="395.5" y="287.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">5.5</text>
  <text x="395.5" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x(5)</text>
  <rect x="434.5" y="264" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="466.5" y="287.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">7.1</text>
  <text x="466.5" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x(6)</text>
  <rect x="505.5" y="264" width="64" height="38" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="537.5" y="287.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">8.4</text>
  <text x="537.5" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x(7)</text>
  <rect x="576.5" y="264" width="64" height="38" fill="#f3e3d6" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="608.5" y="287.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle">9.2</text>
  <text x="608.5" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">x(8)</text>
  <line x1="111.5" y1="129" x2="179.384" y2="253.295" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="182.5,259 181.951,251.893 176.817,254.697" fill="#c9d1d9"/>
  <line x1="182.5" y1="129" x2="460.59" y2="256.295" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="466.5,259 461.807,253.635 459.372,258.954" fill="#c9d1d9"/>
  <line x1="253.5" y1="129" x2="321.384" y2="253.295" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="324.5,259 323.951,251.893 318.817,254.697" fill="#c9d1d9"/>
  <line x1="324.5" y1="129" x2="602.59" y2="256.295" stroke="#c2622d" stroke-width="1.9" stroke-linecap="round"/>
  <polygon points="608.5,259 603.807,253.635 601.372,258.954" fill="#c2622d"/>
  <line x1="395.5" y1="129" x2="117.41" y2="256.295" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="111.5,259 118.628,258.954 116.193,253.635" fill="#c9d1d9"/>
  <line x1="466.5" y1="129" x2="534.384" y2="253.295" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="537.5,259 536.951,251.893 531.817,254.697" fill="#c9d1d9"/>
  <line x1="537.5" y1="129" x2="400.294" y2="254.611" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="395.5,259 402.269,256.768 398.319,252.453" fill="#c9d1d9"/>
  <line x1="608.5" y1="129" x2="259.604" y2="256.765" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="253.5,259 260.609,259.512 258.598,254.018" fill="#c9d1d9"/>
  <text x="360" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">the same values in increasing order</text>
  <text x="56" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The top row is independent and identically distributed. The bottom row is neither: each</text>
  <text x="56" y="398" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">entry is pinned below the one to its right. Here the sample maximum is x(8) = 9.2, and the</text>
  <text x="56" y="414" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">crossing arrows are the one thing sorting destroys, namely which unit produced which value.</text>
</svg>
