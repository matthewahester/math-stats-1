<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" width="720" height="486" role="img">
  <title>A map of families inside and outside the exponential-family form</title>
  <desc>A large rounded box holds eight named families, including the Bernoulli, Poisson and normal. Two boxes sit outside it: the uniform on zero to theta, excluded because its support moves with the parameter, and the Cauchy, excluded because it admits no such factorization.</desc>
  <rect x="0" y="0" width="720" height="486" fill="#ffffff"/>
  <text x="360" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Inside the form, and two different ways to be outside it</text>
  <text x="360" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">f(x) = h(x) exp( eta 1 T 1(x) + ... + eta k T k(x) - A(eta) )</text>
  <rect x="34" y="74" width="424" height="356" fill="#f7fafc" rx="12" stroke="#2f6f9f" stroke-width="1.6"/>
  <text x="246" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">Exponential families</text>
  <text x="246" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">support fixed, factorization available</text>
  <rect x="52" y="140" width="192" height="60" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="148" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Bernoulli(p)</text>
  <text x="148" y="183" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">T(x) = x</text>
  <rect x="256" y="140" width="192" height="60" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="352" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Binomial(n fixed, p)</text>
  <text x="352" y="183" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">T(x) = x</text>
  <rect x="52" y="212" width="192" height="60" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="148" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Poisson(lambda)</text>
  <text x="148" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">T(x) = x</text>
  <rect x="256" y="212" width="192" height="60" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="352" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Exponential(rate lambda)</text>
  <text x="352" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">T(x) = x</text>
  <rect x="52" y="284" width="192" height="60" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="148" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Normal(mu, sigma squared)</text>
  <text x="148" y="327" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">T(x) = x and x squared</text>
  <rect x="256" y="284" width="192" height="60" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="352" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Gamma(alpha, beta)</text>
  <text x="352" y="327" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">T(x) = x and log x</text>
  <rect x="52" y="356" width="192" height="60" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="148" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Beta(a, b)</text>
  <text x="148" y="399" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">T(x) = log x and log(1 - x)</text>
  <rect x="256" y="356" width="192" height="60" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="352" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Geometric(p)</text>
  <text x="352" y="399" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">T(x) = x</text>
  <text x="588" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#a33a3a" text-anchor="middle" font-weight="bold">Outside the form</text>
  <text x="588" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">for two unrelated reasons</text>
  <rect x="486" y="142" width="204" height="46" fill="#f3e3d6" rx="6" stroke="#a33a3a" stroke-width="1.2"/>
  <text x="588" y="169.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#a33a3a" text-anchor="middle">Uniform(0, theta)</text>
  <text x="490" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The set where the density is</text>
  <text x="490" y="225" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">positive runs from 0 to theta,</text>
  <text x="490" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">so it moves when the parameter</text>
  <text x="490" y="255" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">moves. No fixed h(x) can absorb</text>
  <text x="490" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">that.</text>
  <rect x="486" y="300" width="204" height="46" fill="#f3e3d6" rx="6" stroke="#a33a3a" stroke-width="1.2"/>
  <text x="588" y="327.5" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#a33a3a" text-anchor="middle">Cauchy(location)</text>
  <text x="490" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Support is the whole line and</text>
  <text x="490" y="383" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">never moves, and yet the</text>
  <text x="490" y="398" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">density admits no finite</text>
  <text x="490" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">factorization of this shape.</text>
  <text x="34" y="452" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Membership is a property of the whole family, not of one density: check whether the support</text>
  <text x="34" y="468" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">moves with the parameter first, then look for the factorization.</text>
</svg>
