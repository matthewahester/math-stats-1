<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 520" width="1030" height="520" role="img">
  <title>One argument, fifteen weeks</title>
  <desc>A dependency map of the course: eleven boxes of results joined by arrows that run from a result to the later result that uses it, ending at Week 15 and the sequel course.</desc>
