<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img">
  <title>The unbiased class, the point completeness collapses it to, and a biased rival outside</title>
  <desc>A large region holds every estimator with finite variance. Inside it a rounded region holds the unbiased ones, and inside that a smaller region holds the unbiased functions of the sufficient statistic, drawn as a single point because the family is complete. A biased estimator sits outside with smaller mean squared error.</desc>
  <rect x="0" y="0" width="880" height="540" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">What Rao-Blackwell selects, and what it does not</text>
  <text x="440" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">estimators of exp(minus lambda) from a Poisson sample of size ten</text>
  <rect x="46" y="72" width="788" height="372" fill="#ffffff" rx="14" stroke="#c9d1d9" stroke-width="1.4"/>
  <text x="60" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">every estimator with finite variance</text>
  <rect x="70" y="108" width="500" height="316" fill="#eef2f6" rx="76" stroke="#5b6672" stroke-width="1.3"/>
  <text x="96" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">unbiased estimators of exp(minus lambda)</text>
  <rect x="300" y="196" width="250" height="180" fill="#dbe6ef" rx="56" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="425" y="220" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="middle">unbiased functions of T</text>
  <circle cx="425" cy="262" r="7.5" fill="#a33a3a"/>
  <text x="425" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">one point only: the UMVU estimator</text>
  <text x="425" y="314" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">(1 minus 1 / n) raised to the power T</text>
  <text x="425" y="332" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">variance 0.0179</text>
  <circle cx="146" cy="199" r="6" fill="#c2622d"/>
  <text x="90" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">1 if the first panel is clean</text>
  <text x="90" y="224" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">variance 0.2500</text>
  <line x1="164" y1="203" x2="398.157" y2="253.524" stroke="#c2622d" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="405,255 398.822,250.444 397.493,256.603" fill="#c2622d"/>
  <text x="300" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Rao-Blackwell</text>
  <circle cx="146" cy="372" r="6" fill="#6b5b95"/>
  <text x="90" y="346" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">variance 0.0250</text>
  <text x="90" y="400" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b5b95" text-anchor="start">the fraction of clean panels</text>
  <line x1="164" y1="368" x2="398.497" y2="274.59" stroke="#6b5b95" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="405,272 397.331,271.664 399.663,277.517" fill="#6b5b95"/>
  <text x="310" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Rao-Blackwell</text>
  <circle cx="700" cy="258" r="7" fill="#3f7a52"/>
  <text x="700" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">exp(minus x bar)</text>
  <text x="700" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">biased high by 0.0171,</text>
  <text x="700" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">mean squared error 0.0176,</text>
  <text x="700" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">the smaller of the two</text>
  <text x="46" y="474" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Two different crude starting estimators land on the same point, because completeness leaves the inner region only one member.</text>
  <text x="46" y="493" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Without completeness that inner region stays fat, and Rao-Blackwell returns whichever estimator you fed it.</text>
  <text x="46" y="512" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The biased estimator on the right is outside the class the theorem talks about, so beating the winner is not a contradiction.</text>
</svg>
