  <text x="348.593" y="343.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="start">standard deviation 0.136</text>
  <text x="348.593" y="367" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">the variance is smaller by a factor of twelve</text>
  <text x="317.321" y="323.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">p = 0.333</text>
  <text x="96" y="540" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Conditioning on the total moved no probability mass off centre; it only pulled the spread in.</text>
  <text x="96" y="559" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Unbiasedness alone therefore ranks these two estimators as equals, which is why variance has to do the ranking.</text>
</svg>
