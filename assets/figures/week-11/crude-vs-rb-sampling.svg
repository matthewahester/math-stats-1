  <text x="118.963" y="271" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="262.481" y1="254" x2="262.481" y2="258" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="262.481" y="271" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.25</text>
  <line x1="406" y1="254" x2="406" y2="258" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="406" y="271" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.5</text>
