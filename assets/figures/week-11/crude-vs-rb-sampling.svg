  <line x1="549.519" y1="466" x2="549.519" y2="470" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="549.519" y="483" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.75</text>
  <line x1="693.037" y1="466" x2="693.037" y2="470" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="693.037" y="483" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="92" y1="466" x2="96" y2="466" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="469.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="92" y1="416" x2="96" y2="416" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="419.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.1</text>
  <line x1="92" y1="366" x2="96" y2="366" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="369.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.2</text>
  <line x1="92" y1="316" x2="96" y2="316" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="319.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.3</text>
  <text x="406" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">value the estimator reports</text>
  <text x="406" y="302" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">the improved estimator, the mean of twelve trials</text>
  <rect x="103.176" y="462.146" width="31.574" height="3.854" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
