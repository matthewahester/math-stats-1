<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 582" width="820" height="582" role="img">
  <title>Sampling distributions of the crude and improved estimators on one axis</title>
  <desc>The top panel shows the two-point distribution of a single trial, with mass two thirds at zero and one third at one. The bottom panel shows the much tighter distribution of the sample mean of twelve trials. Both are centred at p equal to one third.</desc>
  <rect x="0" y="0" width="820" height="582" fill="#ffffff"/>
  <text x="410" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Same centre, very different spread</text>
  <text x="410" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">both estimators are unbiased for p = 1 / 3; only one of them uses the data</text>
  <line x1="96" y1="254" x2="716" y2="254" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="96" y1="96" x2="96" y2="254" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
