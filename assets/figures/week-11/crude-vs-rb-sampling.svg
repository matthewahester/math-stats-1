  <text x="693.037" y="177.479" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">0.333</text>
  <text x="348.593" y="128.41" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">it can only ever report 0 or 1</text>
  <text x="348.593" y="152.718" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="start">standard deviation 0.471</text>
