  <line x1="693.037" y1="254" x2="693.037" y2="258" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="693.037" y="271" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="92" y1="254" x2="96" y2="254" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="257.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="92" y1="203.359" x2="96" y2="203.359" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="207.159" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.25</text>
  <line x1="92" y1="152.718" x2="96" y2="152.718" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="156.518" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.5</text>
  <line x1="92" y1="102.077" x2="96" y2="102.077" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="105.877" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.75</text>
  <text x="406" y="82" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">the crude estimator, a single trial x1</text>
  <rect x="103.176" y="118.957" width="31.574" height="135.043" fill="#f3e3d6" stroke="#c2622d" stroke-width="1"/>
  <rect x="677.25" y="186.479" width="31.574" height="67.521" fill="#f3e3d6" stroke="#c2622d" stroke-width="1"/>
