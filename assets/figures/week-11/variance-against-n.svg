  <text x="591.333" y="207.111" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="start">the improved estimator</text>
  <text x="614" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">the information floor,</text>
  <text x="614" y="266.37" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">which is never reached</text>
  <text x="86" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Left: conditioning divides the variance by n exactly. Right: it divides by about n,</text>
  <text x="86" y="428" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">and the shortfall against the information floor closes as n grows.</text>
  <text x="86" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">At n = 1 the improved Poisson curve meets the crude flat line at 0.2500; the floor stays below at 0.1726.</text>
  <text x="86" y="468" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Neither flat line moves: reading one observation learns nothing from the other n minus one.</text>
