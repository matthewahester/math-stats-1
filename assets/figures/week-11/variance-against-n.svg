<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img">
  <title>Variance against sample size for the crude and improved estimators in two models</title>
  <desc>In both panels a flat line marks the crude estimator, whose variance never falls, and a decreasing curve marks the improved estimator. The Poisson panel also carries the Cramer-Rao floor as a dashed curve just beneath the improved one.</desc>
