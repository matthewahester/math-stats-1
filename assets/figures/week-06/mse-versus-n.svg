  <text x="100" y="476" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">At n = 10 the three values are 0.03333, 0.01515 and 0.00833. The moment line is shallower by one whole power of n, so</text>
  <text x="100" y="491" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the vertical gap widens without bound rather than settling at a fixed factor. Trimming the correction to (n + 2)/(n +</text>
  <text x="100" y="506" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">1) lowers the error again, to 0.00826, and that fourth estimator is biased.</text>
