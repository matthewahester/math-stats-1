<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 534" width="880" height="534" role="img">
  <title>Mean squared error against sample size for three estimators of theta, on logarithmic axes</title>
  <desc>Log-log plot from n equals four to sixty; both the sample size and the mean squared error are on logarithmic scales, so the tick spacing on the horizontal axis is uneven. The method-of-moments line is highest and straight with slope minus one. The raw maximum and the bias-corrected maximum are two nearly parallel lines twice as steep, bending onto slope minus two, so the vertical gap to the moment line widens as n grows.</desc>
  <rect x="0" y="0" width="880" height="534" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Mean squared error at theta = 1, on logarithmic axes</text>
  <text x="440" y="50" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">both axes are logarithmic, so a power of n is a straight line and the power is its slope</text>
