<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" width="880" height="548" role="img">
  <title>Squared bias and variance as two shot patterns at one target</title>
  <desc>Two concentric-circle targets side by side. The left cloud of shots is centred on the bullseye but widely spread; the right cloud is tighter but sits up and to the right of centre, with the offset labelled bias. A table underneath gives squared bias, variance and mean squared error for the two variance estimators of the second worked example.</desc>
