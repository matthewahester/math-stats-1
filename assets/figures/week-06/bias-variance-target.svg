  <text x="655" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">the bullseye is the true theta</text>
  <rect x="150" y="392" width="630" height="26" fill="#eef2f6"/>
