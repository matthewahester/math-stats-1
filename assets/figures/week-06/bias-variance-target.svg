  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Mean squared error is squared bias plus variance</text>
  <text x="440" y="50" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">shot patterns are exaggerated for legibility; the table carries the real numbers</text>
  <text x="215" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Unbiased, more variable</text>
