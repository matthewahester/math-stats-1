<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" role="img">
  <title>The factorization split and what each family discards</title>
  <desc>The joint density splits into a factor holding all of theta and a factor holding the rest of the data; a table lists six families, their sufficient statistic, and what the reduction throws away.</desc>
  <rect x="0" y="0" width="880" height="580" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">One density, two factors</text>
  <text x="440" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">Fisher and Neyman: the sample density is a theta factor times a data factor</text>
  <rect x="280" y="72" width="320" height="44" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="440" y="98.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">f(x given theta), the sample density</text>
  <line x1="410" y1="116" x2="306.688" y2="147.933" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="300,150 307.618,150.942 305.758,144.923" fill="#1f2933"/>
  <line x1="470" y1="116" x2="573.312" y2="147.933" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="580,150 574.242,144.923 572.382,150.942" fill="#1f2933"/>
  <rect x="120" y="152" width="340" height="62" fill="#dbe6ef" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="290" y="179" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">g(T(x) given theta)</text>
  <text x="290" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">all of theta is here; the data enter only through T</text>
  <rect x="500" y="152" width="260" height="62" fill="#f3e3d6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="630" y="179" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">h(x)</text>
  <text x="630" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">the rest of the data; no theta at all</text>
  <text x="290" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="middle">Bernoulli: p^t times (1-p)^(n-t)</text>
  <text x="630" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="middle">Bernoulli: 1</text>
  <text x="440" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-style="italic">T(x) is whatever the left-hand factor is allowed to look at</text>
  <rect x="66" y="296" width="748" height="26" fill="#eef2f6"/>
  <text x="75" y="313.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Family</text>
  <text x="275" y="313.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">sufficient T(x)</text>
  <text x="507" y="313.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">what the reduction discards</text>
  <line x1="66" y1="296" x2="814" y2="296" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="75" y="339.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Bernoulli(p)</text>
  <text x="275" y="339.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">sum of x, the total</text>
  <text x="507" y="339.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the order of passes and failures</text>
  <line x1="66" y1="322" x2="814" y2="322" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="66" y="348" width="748" height="26" fill="#eef2f6"/>
  <text x="75" y="365.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Normal(mu), sigma known</text>
  <text x="275" y="365.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">sum of x</text>
  <text x="507" y="365.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the spread and the shape</text>
  <line x1="66" y1="348" x2="814" y2="348" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="75" y="391.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Normal(mu, sigma squared)</text>
  <text x="275" y="391.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">sum of x and sum of x squared</text>
  <text x="507" y="391.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">shape beyond mean and spread</text>
  <line x1="66" y1="374" x2="814" y2="374" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="66" y="400" width="748" height="26" fill="#eef2f6"/>
  <text x="75" y="417.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Exponential(lambda)</text>
  <text x="275" y="417.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">sum of x, the total time</text>
  <text x="507" y="417.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">how the total split across units</text>
  <line x1="66" y1="400" x2="814" y2="400" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="75" y="443.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Poisson(lambda)</text>
  <text x="275" y="443.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">sum of x, the total count</text>
  <text x="507" y="443.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">which unit produced which count</text>
  <line x1="66" y1="426" x2="814" y2="426" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="66" y="452" width="748" height="26" fill="#eef2f6"/>
  <text x="75" y="469.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Uniform(0, theta)</text>
  <text x="275" y="469.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the largest x</text>
  <text x="507" y="469.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">all n minus one smaller readings</text>
  <line x1="66" y1="452" x2="814" y2="452" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="66" y1="478" x2="814" y2="478" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="266" y1="296" x2="266" y2="478" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="498" y1="296" x2="498" y2="478" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="66" y1="296" x2="66" y2="478" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="814" y1="296" x2="814" y2="478" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="522" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Reading the last column</text>
  <text x="66" y="542" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Each discard is a real feature of the data that carries nothing about theta under the stated model.</text>
  <text x="66" y="557" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Under a different model the same feature can carry a great deal.</text>
</svg>
