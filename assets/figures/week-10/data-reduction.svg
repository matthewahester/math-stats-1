<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 566" width="880" height="566" role="img">
  <title>From twelve recorded trials to one total, and back again</title>
  <desc>Twelve pass-fail results reduce to the total seven; a draw from the conditional law given that total rebuilds a sample with the same distribution, and needs no p to do it.</desc>
  <rect x="0" y="0" width="880" height="566" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Twelve trials, one total, and the reconstruction it supports</text>
  <text x="440" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">a Bernoulli sample reduced to its sufficient statistic</text>
  <text x="164" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">as recorded, in run order</text>
  <rect x="164" y="96" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="179" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="197" y="96" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="212" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="230" y="96" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="245" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="263" y="96" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="278" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="296" y="96" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="311" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="329" y="96" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="344" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="362" y="96" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="377" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="395" y="96" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="410" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="428" y="96" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="443" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="461" y="96" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="476" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="494" y="96" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="509" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="527" y="96" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="542" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <text x="557" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="end">seven passes, five failures</text>
  <line x1="440" y1="134" x2="440" y2="169" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="440,176 443.15,169 436.85,169" fill="#1f2933"/>
  <text x="600" y="152" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the map to T keeps every</text>
  <text x="600" y="167" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">factor that involves p</text>
  <rect x="320" y="180" width="240" height="50" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="440" y="201" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">T = 7</text>
  <text x="440" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">the total number of passes</text>
  <line x1="440" y1="234" x2="440" y2="269" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="440,276 443.15,269 436.85,269" fill="#1f2933"/>
  <text x="600" y="244" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">given T = 7 the sample is</text>
  <text x="600" y="259" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">uniform on the 792</text>
  <text x="600" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">arrangements, whatever p is</text>
  <rect x="276" y="280" width="328" height="50" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="440" y="301" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">draw one arrangement at random</text>
  <text x="440" y="318" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">no value of p is needed for this step</text>
  <line x1="440" y1="334" x2="440" y2="369" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="440,376 443.15,369 436.85,369" fill="#1f2933"/>
  <text x="164" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">rebuilt, in a new order</text>
  <rect x="164" y="384" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="179" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="197" y="384" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="212" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="230" y="384" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="245" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="263" y="384" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="278" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="296" y="384" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="311" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="329" y="384" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="344" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="362" y="384" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="377" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="395" y="384" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="410" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="428" y="384" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="443" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="461" y="384" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="476" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <rect x="494" y="384" width="30" height="30" fill="#ffffff" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="509" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6672" text-anchor="middle">0</text>
  <rect x="527" y="384" width="30" height="30" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="542" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <text x="557" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="end">still seven passes</text>
  <line x1="60" y1="448" x2="820" y2="448" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="60" y="472" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">What the total cannot see</text>
  <text x="60" y="492" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The recorded order has 2 runs of like results. Averaged over the 792 arrangements the count is 6.83, and</text>
  <text x="60" y="507" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the rebuilt order above has 7. Given the total that gap has a distribution free of p, which is exactly</text>
  <text x="60" y="522" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">why it is free to say something about the model.</text>
</svg>
