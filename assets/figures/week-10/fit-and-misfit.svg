  <text x="66" y="442" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The band should hold about 5.5 of ten readings. Sample A supplies 5 and sample B supplies 0. A band fixed</text>
  <text x="66" y="457" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">in advance would be missed by all ten with probability 0.0004; this band is estimated from the same ten,</text>
  <text x="66" y="472" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">and simulating that check gives about 0.00002. The reduction is exact and the model is refuted either way.</text>
