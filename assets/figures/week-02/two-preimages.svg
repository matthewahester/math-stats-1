  <circle cx="423" cy="284.75" r="4.2" fill="#2f6f9f"/>
  <text x="572" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="bold">What the picture forces</text>
  <text x="572" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Every y above zero has two preimages.</text>
  <text x="572" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Both strips pour probability into the</text>
  <text x="572" y="140" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">same y strip, so both must appear in</text>
  <text x="572" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the density.</text>
  <text x="572" y="187" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">Right branch only:</text>
  <text x="572" y="206" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">total mass one half. Refused.</text>
  <text x="572" y="235" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">Both branches:</text>
  <text x="572" y="254" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="start">f_Y(y) = [ f_X(sqrt y) + f_X(minus</text>
  <text x="572" y="269" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="start">sqrt y) ] divided by (2 sqrt y), for y</text>
  <text x="572" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="start">above zero.</text>
  <text x="572" y="307" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Audit habit: integrate the candidate</text>
  <text x="572" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">density. If the total is not one, a</text>
  <text x="572" y="337" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">branch or an indicator went missing.</text>
</svg>
