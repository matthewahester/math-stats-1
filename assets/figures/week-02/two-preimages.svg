  <text x="70" y="332.338" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1</text>
  <line x1="74" y1="265.077" x2="78" y2="265.077" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="268.877" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">2</text>
  <line x1="74" y1="201.615" x2="78" y2="201.615" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="205.415" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">3</text>
  <line x1="74" y1="138.154" x2="78" y2="138.154" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="141.954" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">4</text>
  <line x1="74" y1="74.692" x2="78" y2="74.692" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="78.492" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">5</text>
  <text x="308" y="430" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">x</text>
  <text x="70" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">y = x squared</text>
