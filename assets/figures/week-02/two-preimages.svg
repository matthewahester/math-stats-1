  <text x="396.462" y="409" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="484.923" y1="392" x2="484.923" y2="396" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="484.923" y="409" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="74" y1="392" x2="78" y2="392" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
