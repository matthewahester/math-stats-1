  <text x="193" y="352.654" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">x near minus 1.22</text>
  <text x="423" y="352.654" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">x near plus 1.22</text>
  <text x="91.269" y="272.115" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">y strip</text>
