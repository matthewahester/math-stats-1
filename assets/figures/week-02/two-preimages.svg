<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img">
  <title>A non-monotone map sends two x strips into one y strip</title>
  <desc>A parabola with a horizontal band on the y axis whose preimage is two separate intervals on the x axis, one on each side of zero.</desc>
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <text x="40" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2933" text-anchor="start" font-weight="bold">y = x squared: one y strip, two x strips, so two terms to add</text>
