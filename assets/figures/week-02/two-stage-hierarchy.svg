  <circle cx="833.803" cy="357.12" r="3" fill="#c2622d"/>
  <circle cx="862.676" cy="357.729" r="3" fill="#c2622d"/>
  <text x="675" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">blue bars: negative binomial marginal, variance 12</text>
  <text x="675" y="444" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">orange line: Poisson(4), variance 4</text>
  <text x="675" y="468" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">Same mean, heavier shoulders, fatter right tail.</text>
</svg>
