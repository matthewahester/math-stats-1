  <line x1="476" y1="404.6" x2="476" y2="414.6" stroke="#c2622d" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="511.833" y1="404.6" x2="511.833" y2="414.6" stroke="#c2622d" stroke-width="1.6" stroke-linecap="round"/>
  <text x="493.917" y="428.6" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">dx = 0.25</text>
  <line x1="100.467" y1="279.284" x2="100.467" y2="244.42" stroke="#2f6f9f" stroke-width="1.6" stroke-linecap="round"/>
