  <circle cx="200.083" cy="260.689" r="4.2" fill="#2f6f9f"/>
  <circle cx="493.917" cy="89.25" r="4.2" fill="#c2622d"/>
  <text x="610" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="bold">The bookkeeping</text>
  <text x="610" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">A monotone g carries the interval from x</text>
  <text x="610" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">to x plus dx onto the interval from y to</text>
  <text x="610" y="140" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">y plus dy, and onto nothing else. So the</text>
  <text x="610" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">two strips hold the same probability.</text>
  <text x="610" y="187" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">f_Y(y) times |dy| = f_X(x) times |dx|</text>
  <text x="610" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">f_Y(y) = f_X(x) times |dx / dy|</text>
  <text x="610" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Blue strip: g is steep, the image is</text>
  <text x="610" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">stretched, and the density is pressed</text>
  <text x="610" y="273" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">down. Orange strip: g is nearly flat,</text>
  <text x="610" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the image is compressed, and the density</text>
  <text x="610" y="303" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">is piled up.</text>
  <text x="610" y="331" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">The factor is the reciprocal of a slope,</text>
  <text x="610" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">so it is a rate of stretch, not a</text>
  <text x="610" y="361" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">probability. It can be larger than one.</text>
</svg>
