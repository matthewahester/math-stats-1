  <line x1="182.167" y1="409.6" x2="218" y2="409.6" stroke="#2f6f9f" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="182.167" y1="404.6" x2="182.167" y2="414.6" stroke="#2f6f9f" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="218" y1="404.6" x2="218" y2="414.6" stroke="#2f6f9f" stroke-width="1.6" stroke-linecap="round"/>
  <text x="200.083" y="428.6" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">dx = 0.25</text>
