  <text x="580" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="bold">What agreement does and does not prove</text>
  <text x="580" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Bars: relative frequency per unit of</text>
  <text x="580" y="131" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">r from twenty thousand draws. Curve:</text>
  <text x="580" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the density r times exp of minus r</text>
  <text x="580" y="161" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">squared over two, obtained from the</text>
  <text x="580" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">polar Jacobian.</text>
  <text x="580" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">predicted mean  1.2533</text>
  <text x="580" y="227" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">simulated mean  1.2585</text>
  <text x="580" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">A match at this resolution rules out</text>
  <text x="580" y="273" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">a dropped Jacobian or a lost factor</text>
  <text x="580" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">of two. It cannot rule out an error</text>
  <text x="580" y="303" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">that happens to vanish at this</text>
  <text x="580" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">parameter value.</text>
