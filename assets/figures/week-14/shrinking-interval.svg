<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img">
  <title>Intervals shrinking around a displaced target as the sample grows</title>
  <desc>Six horizontal intervals for the model-implied median, one per sample size, all centred at 1.317 and narrowing; the true median at 0.792 is inside only the two smallest samples.</desc>
  <rect x="0" y="0" width="840" height="500" fill="#ffffff"/>
  <text x="420" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">More data, narrower interval, and still the wrong quantity</text>
  <text x="420" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">the median implied by a fitted exponential, at six sample sizes</text>
  <line x1="128" y1="364" x2="748" y2="364" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="128" y1="96" x2="128" y2="364" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="128" y1="364" x2="128" y2="368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="128" y="381" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="242.815" y1="364" x2="242.815" y2="368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="242.815" y="381" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.5</text>
  <line x1="357.63" y1="364" x2="357.63" y2="368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="357.63" y="381" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="472.444" y1="364" x2="472.444" y2="368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="472.444" y="381" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1.5</text>
  <line x1="587.259" y1="364" x2="587.259" y2="368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="587.259" y="381" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="702.074" y1="364" x2="702.074" y2="368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="702.074" y="381" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2.5</text>
  <text x="438" y="402" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">median lifetime in years</text>
  <line x1="430.418" y1="96" x2="430.418" y2="364" stroke="#c2622d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="309.883" y1="96" x2="309.883" y2="364" stroke="#a33a3a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="164.316" y1="118.333" x2="696.519" y2="118.333" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="164.316" y1="112.333" x2="164.316" y2="124.333" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="696.519" y1="112.333" x2="696.519" y2="124.333" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="430.418,114.333 434.418,118.333 430.418,122.333 426.418,118.333" fill="#3f7a52"/>
  <text x="114" y="122.333" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">n = 25</text>
  <text x="706.519" y="122.333" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">width 2.32</text>
  <line x1="297.367" y1="163" x2="563.468" y2="163" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="297.367" y1="157" x2="297.367" y2="169" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="563.468" y1="157" x2="563.468" y2="169" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="430.418,159 434.418,163 430.418,167 426.418,163" fill="#3f7a52"/>
  <text x="114" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">n = 100</text>
  <text x="573.468" y="167" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">width 1.16</text>
  <line x1="363.892" y1="207.667" x2="496.943" y2="207.667" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="363.892" y1="201.667" x2="363.892" y2="213.667" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="496.943" y1="201.667" x2="496.943" y2="213.667" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="430.418,203.667 434.418,207.667 430.418,211.667 426.418,207.667" fill="#1f2933"/>
  <text x="114" y="211.667" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">n = 400</text>
  <text x="506.943" y="211.667" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">width 0.58</text>
  <line x1="397.155" y1="252.333" x2="463.68" y2="252.333" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="397.155" y1="246.333" x2="397.155" y2="258.333" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="463.68" y1="246.333" x2="463.68" y2="258.333" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="430.418,248.333 434.418,252.333 430.418,256.333 426.418,252.333" fill="#1f2933"/>
  <text x="114" y="256.333" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">n = 1600</text>
  <text x="473.68" y="256.333" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">width 0.29</text>
  <line x1="413.786" y1="297" x2="447.049" y2="297" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="413.786" y1="291" x2="413.786" y2="303" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="447.049" y1="291" x2="447.049" y2="303" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="430.418,293 434.418,297 430.418,301 426.418,297" fill="#1f2933"/>
  <text x="114" y="301" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">n = 6400</text>
  <text x="457.049" y="301" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">width 0.14</text>
  <line x1="422.102" y1="341.667" x2="438.733" y2="341.667" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="422.102" y1="335.667" x2="422.102" y2="347.667" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="438.733" y1="335.667" x2="438.733" y2="347.667" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="430.418,337.667 434.418,341.667 430.418,345.667 426.418,341.667" fill="#1f2933"/>
  <text x="114" y="345.667" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">n = 25600</text>
  <text x="448.733" y="345.667" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">width 0.07</text>
  <text x="438.418" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">what the estimator converges to, 1.317</text>
  <text x="301.883" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="end">the real median, 0.792</text>
  <text x="134" y="422" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">green bars still reach the real median; dark bars no longer do</text>
  <text x="128" y="452" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The bias is a fixed distance of 0.525 years. The half-width falls like one over the square root of n,</text>
  <text x="128" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">so coverage of the real median collapses near n = 122 and never recovers.</text>
</svg>
