<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img">
  <title>Two data-generating stories that imply the same observed table</title>
  <desc>A randomized story with an arrow from treatment to outcome, and a confounded story with a hidden common cause and no treatment effect, both feeding one identical two by two table of observed proportions.</desc>
  <rect x="0" y="0" width="880" height="540" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Two stories that no amount of data can tell apart</text>
  <text x="440" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">identical observed distribution, different scientific target</text>
  <rect x="30" y="74" width="400" height="206" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="230" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">Story A: assignment by a coin</text>
  <rect x="70" y="150" width="116" height="44" fill="#ffffff" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="128" y="176.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">A: treated</text>
  <rect x="288" y="150" width="116" height="44" fill="#ffffff" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="346" y="176.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">Y: recovered</text>
  <line x1="190" y1="172" x2="275" y2="172" stroke="#2f6f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="284,172 275,167.95 275,176.05" fill="#2f6f9f"/>
  <text x="237" y="141" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="middle">effect 0.30</text>
  <text x="230" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">the coin is independent of everything else,</text>
  <text x="230" y="250" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">so the two groups are comparable by design</text>
  <rect x="450" y="74" width="400" height="206" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="650" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#c2622d" text-anchor="middle" font-weight="bold">Story B: a hidden trait drives both</text>
  <rect x="592" y="118" width="116" height="40" fill="#ffffff" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="650" y="142.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">U: hidden trait</text>
  <rect x="474" y="196" width="116" height="40" fill="#ffffff" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="532" y="220.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">A: treated</text>
  <rect x="710" y="196" width="116" height="40" fill="#ffffff" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="768" y="220.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">Y: recovered</text>
  <line x1="618" y1="158" x2="562.92" y2="187.726" stroke="#c2622d" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="555,192 564.844,191.29 560.997,184.162" fill="#c2622d"/>
  <line x1="682" y1="158" x2="737.08" y2="187.726" stroke="#c2622d" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="745,192 739.003,184.162 735.156,191.29" fill="#c2622d"/>
  <line x1="594" y1="216" x2="706" y2="216" stroke="#a33a3a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="643" y1="209" x2="657" y2="223" stroke="#a33a3a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="657" y1="209" x2="643" y2="223" stroke="#a33a3a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="650" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="middle">no arrow from A to Y, so the effect is exactly zero</text>
  <text x="440" y="306" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Both stories imply this joint distribution of the observed variables</text>
  <line x1="230" y1="284" x2="322.426" y2="315.425" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="330,318 323.585,312.016 321.267,318.833" fill="#5b6672"/>
  <line x1="650" y1="284" x2="557.574" y2="315.425" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="550,318 558.733,318.833 556.415,312.016" fill="#5b6672"/>
  <rect x="288" y="322" width="304" height="28" fill="#eef2f6"/>
  <text x="297" y="340.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold"></text>
  <text x="442" y="340.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">A = 1</text>
  <text x="542" y="340.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">A = 0</text>
  <line x1="288" y1="322" x2="592" y2="322" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="297" y="368.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Y = 1</text>
  <text x="442" y="368.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0.30</text>
  <text x="542" y="368.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0.15</text>
  <line x1="288" y1="350" x2="592" y2="350" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="297" y="396.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Y = 0</text>
  <text x="442" y="396.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0.20</text>
  <text x="542" y="396.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0.35</text>
  <line x1="288" y1="378" x2="592" y2="378" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="288" y1="406" x2="592" y2="406" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="392" y1="322" x2="392" y2="406" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="492" y1="322" x2="492" y2="406" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="288" y1="322" x2="288" y2="406" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="592" y1="322" x2="592" y2="406" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="440" y="438" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">Observed contrast: 0.60 minus 0.30, which is 0.30</text>
  <text x="440" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">Causal contrast: 0.30 under Story A, 0.00 under Story B</text>
  <text x="440" y="488" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">An assumption about how treatment was assigned chooses between them. A larger sample does not.</text>
</svg>
