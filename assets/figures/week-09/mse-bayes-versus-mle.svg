<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img">
  <title>Mean squared error of a Bayes estimator against that of the sample mean</title>
  <desc>A flat line at 1.0 for the sample mean and an upward parabola for the Bayes estimator with its lowest value 0.64 at mu equal to 100; the two cross at 97 and at 103.</desc>
  <rect x="0" y="0" width="820" height="500" fill="#ffffff"/>
  <text x="410" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">The frequentist cost of shrinking toward a prior mean</text>
  <text x="410" y="53" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">sixteen readings, known standard deviation four, prior N(100, 4)</text>
  <text x="96" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">mean squared error</text>
