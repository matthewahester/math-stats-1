  <text x="414" y="297.265" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">0.64 at the prior mean</text>
  <text x="96" y="452" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Squared bias grows as the truth moves away from the prior mean; the variance saving stays fixed at 0.36.</text>
  <text x="96" y="472" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Averaged over the prior itself, the Bayes estimator costs 0.80 against 1.00 for the sample mean.</text>
