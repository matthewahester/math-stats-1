  <text x="414" y="259.306" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="middle">sample mean, risk 1.00 at every mu</text>
  <text x="414" y="342.571" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Bayes estimator wins inside this band</text>
  <text x="414" y="364.612" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">97 to 103, one and a half prior standard deviations</text>
