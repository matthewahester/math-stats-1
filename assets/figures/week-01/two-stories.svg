<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img">
  <title>Two data-generating stories with the same observed distribution</title>
  <desc>Left: a diagram where an unmeasured comorbidity causes both screening and severity, and screening lowers severity by one unit. Right: a diagram where screening alone raises severity by 0.8. Both panels show the identical observed means 2.6 and 3.4.</desc>
  <rect x="0" y="0" width="900" height="510" fill="#ffffff"/>
  <text x="30" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Two stories the observed data cannot tell apart</text>
  <line x1="450" y1="45" x2="450" y2="445" stroke="#c9d1d9" stroke-width="1.2" stroke-linecap="round"/>
  <text x="240" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Story 1: an unmeasured common cause</text>
  <text x="240" y="84" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">comorbidity, never recorded</text>
  <circle cx="240" cy="116" r="22" fill="#f2e9df" stroke="#5b6672" stroke-width="1.4"/>
  <text x="240" y="121" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">C</text>
  <circle cx="160" cy="206" r="22" fill="#dbe6ef" stroke="#5b6672" stroke-width="1.4"/>
  <text x="160" y="211" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">A</text>
  <circle cx="320" cy="206" r="22" fill="#dbe6ef" stroke="#5b6672" stroke-width="1.4"/>
  <text x="320" y="211" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Y</text>
  <line x1="226" y1="134" x2="178.855" y2="182.958" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="174,188 181.125,185.143 176.586,180.773" fill="#5b6672"/>
  <line x1="254" y1="134" x2="301.145" y2="182.958" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="306,188 303.414,180.773 298.875,185.143" fill="#5b6672"/>
  <line x1="183" y1="206" x2="290" y2="206" stroke="#3f7a52" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="297,206 290,202.85 290,209.15" fill="#3f7a52"/>
  <text x="240" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="middle">effect -1.0</text>
  <text x="160" y="244" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">screened</text>
  <text x="320" y="244" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">severity</text>
  <text x="675" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Story 2: screening itself is harmful</text>
  <text x="675" y="84" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">nothing else in the picture</text>
  <circle cx="595" cy="206" r="22" fill="#dbe6ef" stroke="#5b6672" stroke-width="1.4"/>
  <text x="595" y="211" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">A</text>
  <circle cx="755" cy="206" r="22" fill="#dbe6ef" stroke="#5b6672" stroke-width="1.4"/>
  <text x="755" y="211" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Y</text>
  <line x1="618" y1="206" x2="725" y2="206" stroke="#6b5b95" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="732,206 725,202.85 725,209.15" fill="#6b5b95"/>
  <text x="675" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b5b95" text-anchor="middle">effect +0.8</text>
  <text x="595" y="244" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">screened</text>
  <text x="755" y="244" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">severity</text>
  <rect x="120" y="300" width="240" height="120" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="185.455" y1="420" x2="185.455" y2="424" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="185.455" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">not screened</text>
  <line x1="294.545" y1="420" x2="294.545" y2="424" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="294.545" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">screened</text>
  <line x1="116" y1="420" x2="120" y2="420" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="423.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="116" y1="390" x2="120" y2="390" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="393.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1</text>
  <line x1="116" y1="360" x2="120" y2="360" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="363.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">2</text>
  <line x1="116" y1="330" x2="120" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="333.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">3</text>
  <line x1="116" y1="300" x2="120" y2="300" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="303.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">4</text>
  <text x="120" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">mean severity</text>
  <rect x="155.455" y="342" width="60" height="78" fill="#2f6f9f"/>
  <rect x="264.545" y="318" width="60" height="102" fill="#2f6f9f"/>
  <text x="185.455" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">2.6</text>
  <text x="294.545" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">3.4</text>
  <text x="240" y="458" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">what the data show</text>
  <rect x="555" y="300" width="240" height="120" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="620.455" y1="420" x2="620.455" y2="424" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="620.455" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">not screened</text>
  <line x1="729.545" y1="420" x2="729.545" y2="424" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="729.545" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">screened</text>
  <line x1="551" y1="420" x2="555" y2="420" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="547" y="423.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="551" y1="390" x2="555" y2="390" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="547" y="393.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1</text>
  <line x1="551" y1="360" x2="555" y2="360" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="547" y="363.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">2</text>
  <line x1="551" y1="330" x2="555" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="547" y="333.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">3</text>
  <line x1="551" y1="300" x2="555" y2="300" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="547" y="303.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">4</text>
  <text x="555" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">mean severity</text>
  <rect x="590.455" y="342" width="60" height="78" fill="#2f6f9f"/>
  <rect x="699.545" y="318" width="60" height="102" fill="#2f6f9f"/>
  <text x="620.455" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">2.6</text>
  <text x="729.545" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">3.4</text>
  <text x="675" y="458" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">what the data show</text>
  <text x="450" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Identical observed law. Opposite causal claims. No sample size separates them.</text>
</svg>
