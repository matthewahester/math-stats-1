<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img">
  <title>Six objects of a statistical experiment and the arrows between them</title>
  <desc>A flow diagram. Model leads to observed data and to the estimand; observed data leads to the estimator and then to the estimate; a dashed arrow from the scientific target down to the estimand is labelled identification assumptions.</desc>
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <text x="40" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Six objects, and the arrows that actually exist</text>
  <rect x="380" y="50" width="240" height="58" fill="#f7f2ea" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="500" y="75" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Scientific target</text>
  <text x="500" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">the quantity the study is about</text>
  <rect x="380" y="184" width="240" height="58" fill="#dbe6ef" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="500" y="209" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Estimand</text>
  <text x="500" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">psi = g(theta)</text>
  <rect x="40" y="184" width="220" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="150" y="209" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Model</text>
  <text x="150" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">P theta for theta in Theta</text>
  <rect x="40" y="344" width="220" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="150" y="369" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Observed data</text>
  <text x="150" y="386" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">x1, ..., xn</text>
  <rect x="380" y="344" width="240" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="500" y="369" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Estimator</text>
  <text x="500" y="386" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">T(X1, ..., Xn)</text>
  <rect x="740" y="344" width="220" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="850" y="369" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Estimate</text>
  <text x="850" y="386" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">the number T(x)</text>
  <line x1="500" y1="108" x2="500" y2="175" stroke="#a33a3a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <polygon points="500,182 503.15,175 496.85,175" fill="#a33a3a"/>
  <text x="514" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="start">identification assumptions</text>
  <line x1="260" y1="213" x2="371" y2="213" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="378,213 371,209.85 371,216.15" fill="#1f2933"/>
  <text x="320" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">defines</text>
  <line x1="150" y1="242" x2="150" y2="335" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="150,342 153.15,335 146.85,335" fill="#1f2933"/>
  <text x="162" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">generates one sample</text>
  <line x1="260" y1="373" x2="371" y2="373" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="378,373 371,369.85 371,376.15" fill="#1f2933"/>
  <text x="320" y="364" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">feeds</text>
  <line x1="620" y1="373" x2="731" y2="373" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="738,373 731,369.85 731,376.15" fill="#1f2933"/>
  <text x="680" y="364" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">evaluate at x</text>
  <line x1="500" y1="344" x2="500" y2="251" stroke="#2f6f9f" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="500,244 496.85,251 503.15,251" fill="#2f6f9f"/>
  <text x="514" y="299" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2f6f9f" text-anchor="start">targets, with error</text>
  <text x="500" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Solid arrows are free. The dashed one is bought with assumptions.</text>
</svg>
