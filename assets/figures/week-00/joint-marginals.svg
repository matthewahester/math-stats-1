  <text x="416" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">marginal of Y</text>
  <text x="528" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Integrate the joint density</text>
  <text x="528" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">over y and the marginal of</text>
  <text x="528" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">X is left. Integrate over x</text>
  <text x="528" y="244" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">instead and the marginal of</text>
  <text x="528" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Y is left. Neither marginal</text>
  <text x="528" y="276" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">remembers how the two</text>
  <text x="528" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">variables move together.</text>
  <text x="528" y="314" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">The dashed slice at x = 0.3</text>
  <text x="528" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">is not yet a density:</text>
  <text x="528" y="346" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">divide it by f(0.3) = 0.8</text>
  <text x="528" y="362" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">and the area becomes one.</text>
  <text x="528" y="378" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">That rescaled slice is the</text>
  <text x="528" y="394" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">conditional density of Y</text>
  <text x="528" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">given X = 0.3.</text>
  <text x="528" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Multiplying the two</text>
  <text x="528" y="464" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">marginals gives (x + 0.5)</text>
  <text x="528" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">times (y + 0.5), which is</text>
  <text x="528" y="496" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">not x + y, so independence</text>
  <text x="528" y="512" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">fails.</text>
  <text x="24" y="562" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Every question about X and Y alone, or about one given the other, is answered by integrating or slicing this one surface.</text>
</svg>
