<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 584" width="730" height="584" role="img">
  <title>Joint density on the unit square with both marginals</title>
  <desc>A shaded unit square whose joint density x plus y increases toward the upper right, with the marginal density of X drawn above the square, the marginal density of Y drawn to its right, and a dashed vertical slice at x equals 0.3.</desc>
  <rect x="0" y="0" width="730" height="584" fill="#ffffff"/>
  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">One joint density, three views</text>
  <text x="24" y="53" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">f(x, y) = x + y on the unit square. Both marginals are read off the same object.</text>
