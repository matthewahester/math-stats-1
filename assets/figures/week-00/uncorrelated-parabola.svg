<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img">
  <title>Exactly uncorrelated points that lie on a parabola</title>
  <desc>Nineteen dots forming a symmetric parabola opening upward, with a flat dashed least squares line at height 0.30 running through them, showing zero correlation alongside an exact functional dependence.</desc>
  <rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Zero correlation, total dependence</text>
  <text x="24" y="53" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">X spread symmetrically about zero, and Y equal to X times X.</text>
  <rect x="92" y="84" width="420" height="268" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="92" y1="334.945" x2="512" y2="334.945" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="92" y1="274.036" x2="512" y2="274.036" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="92" y1="213.127" x2="512" y2="213.127" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="92" y1="152.218" x2="512" y2="152.218" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="92" y1="91.309" x2="512" y2="91.309" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="107.556" y1="352" x2="107.556" y2="356" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="107.556" y="369" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-1</text>
  <line x1="204.778" y1="352" x2="204.778" y2="356" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="204.778" y="369" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-0.5</text>
  <line x1="302" y1="352" x2="302" y2="356" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="302" y="369" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="399.222" y1="352" x2="399.222" y2="356" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="399.222" y="369" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.5</text>
  <line x1="496.444" y1="352" x2="496.444" y2="356" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="496.444" y="369" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="88" y1="334.945" x2="92" y2="334.945" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="338.745" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="88" y1="274.036" x2="92" y2="274.036" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="277.836" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.25</text>
  <line x1="88" y1="213.127" x2="92" y2="213.127" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="216.927" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.5</text>
  <line x1="88" y1="152.218" x2="92" y2="152.218" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="156.018" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.75</text>
  <line x1="88" y1="91.309" x2="92" y2="91.309" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="84" y="95.109" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1</text>
  <text x="302" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">x</text>
  <text x="84" y="72" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">y</text>
  <circle cx="127" cy="137.6" r="4.6" fill="#2f6f9f"/>
  <circle cx="146.444" cy="179.018" r="4.6" fill="#2f6f9f"/>
  <circle cx="165.889" cy="215.564" r="4.6" fill="#2f6f9f"/>
  <circle cx="185.333" cy="247.236" r="4.6" fill="#2f6f9f"/>
  <circle cx="204.778" cy="274.036" r="4.6" fill="#2f6f9f"/>
  <circle cx="224.222" cy="295.964" r="4.6" fill="#2f6f9f"/>
  <circle cx="243.667" cy="313.018" r="4.6" fill="#2f6f9f"/>
  <circle cx="263.111" cy="325.2" r="4.6" fill="#2f6f9f"/>
  <circle cx="282.556" cy="332.509" r="4.6" fill="#2f6f9f"/>
  <circle cx="302" cy="334.945" r="4.6" fill="#2f6f9f"/>
  <circle cx="321.444" cy="332.509" r="4.6" fill="#2f6f9f"/>
  <circle cx="340.889" cy="325.2" r="4.6" fill="#2f6f9f"/>
  <circle cx="360.333" cy="313.018" r="4.6" fill="#2f6f9f"/>
  <circle cx="379.778" cy="295.964" r="4.6" fill="#2f6f9f"/>
  <circle cx="399.222" cy="274.036" r="4.6" fill="#2f6f9f"/>
  <circle cx="418.667" cy="247.236" r="4.6" fill="#2f6f9f"/>
  <circle cx="438.111" cy="215.564" r="4.6" fill="#2f6f9f"/>
  <circle cx="457.556" cy="179.018" r="4.6" fill="#2f6f9f"/>
  <circle cx="477" cy="137.6" r="4.6" fill="#2f6f9f"/>
  <line x1="92" y1="261.855" x2="512" y2="261.855" stroke="#a33a3a" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="302" y="250.891" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="middle">least squares line, slope zero</text>
  <line x1="302" y1="84" x2="302" y2="352" stroke="#5b6672" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
  <text x="103.667" y="103.491" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">sample correlation r = 0.00</text>
  <text x="540" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Covariance is the average</text>
  <text x="540" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">of x times y after</text>
  <text x="540" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">centring. Here that</text>
  <text x="540" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">average is the average of</text>
  <text x="540" y="174" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">x cubed, and the symmetry</text>
  <text x="540" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">of the x values makes it</text>
  <text x="540" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">exactly zero.</text>
  <text x="540" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Yet knowing x pins y down</text>
  <text x="540" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">completely. Correlation</text>
  <text x="540" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">measures straight-line</text>
  <text x="540" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">association only, and</text>
  <text x="540" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">this relation has none.</text>
  <text x="24" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Uncorrelated is a statement about one linear summary. Independent is a statement about the whole joint distribution.</text>
</svg>
