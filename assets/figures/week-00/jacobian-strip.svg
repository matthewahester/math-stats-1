  <rect x="348" y="359.144" width="28.8" height="36.856" fill="#3f7a52" fill-opacity="0.26"/>
  <rect x="96" y="359.144" width="280.8" height="11.182" fill="#3f7a52" fill-opacity="0.26"/>
  <line x1="348" y1="359.144" x2="376.8" y2="359.144" stroke="#3f7a52" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="362.4" y="331.933" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="middle">du = 0.08</text>
  <text x="385.8" y="368.735" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="start">dy = 0.11</text>
  <rect x="150" y="199.964" width="28.8" height="196.036" fill="#a33a3a" fill-opacity="0.26"/>
  <rect x="96" y="199.964" width="82.8" height="44.169" fill="#a33a3a" fill-opacity="0.26"/>
  <line x1="150" y1="199.964" x2="178.8" y2="199.964" stroke="#a33a3a" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="164.4" y="172.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="middle">du = 0.08</text>
  <text x="187.8" y="226.049" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="start">dy = 0.43</text>
  <text x="524" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Both strips hold the same</text>
  <text x="524" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">probability, 0.08, because</text>
  <text x="524" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">U is uniform. The picture</text>
  <text x="524" y="152" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">only asks where that</text>
  <text x="524" y="168" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">probability lands.</text>
  <text x="524" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">Near u = 0.74 the curve is</text>
  <text x="524" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">gentle, so the probability</text>
  <text x="524" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">arrives packed into a short</text>
  <text x="524" y="244" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">interval and the density of</text>
  <text x="524" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">Y is large there.</text>
  <text x="524" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">Near u = 0.19 the curve is</text>
  <text x="524" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">steep, so the same</text>
  <text x="524" y="332" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">probability is smeared</text>
  <text x="524" y="348" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">across an interval four</text>
  <text x="524" y="364" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">times longer and the</text>
  <text x="524" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">density of Y is smaller.</text>
  <text x="524" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Hence f(y) = f(u) times</text>
  <text x="524" y="420" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">|du/dy|, with u = exp(-y).</text>
  <text x="24" y="466" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The stretch factor is the price of moving probability from one ruler to another.</text>
</svg>
