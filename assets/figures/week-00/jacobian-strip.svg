<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 486" width="730" height="486" role="img">
  <title>Why the change-of-variables formula carries a stretch factor</title>
  <desc>The decreasing map y equals minus log u drawn from u equals 0.05 to 1, with two equal-width strips on the u axis sent to a short interval near the flat end and a long interval near the steep end of the curve.</desc>
  <rect x="0" y="0" width="730" height="486" fill="#ffffff"/>
  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">The Jacobian is a stretch factor, not a convention</text>
  <text x="24" y="53" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The map y = -log u, strictly decreasing, applied to U uniform on the interval 0 to 1.</text>
  <rect x="96" y="86" width="360" height="310" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="96" y1="396" x2="96" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="96" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="186" y1="396" x2="186" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="186" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.25</text>
  <line x1="276" y1="396" x2="276" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="276" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.5</text>
  <line x1="366" y1="396" x2="366" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="366" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.75</text>
  <line x1="456" y1="396" x2="456" y2="400" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="456" y="413" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="92" y1="396" x2="96" y2="396" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="399.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="92" y1="292.667" x2="96" y2="292.667" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="296.467" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1</text>
  <line x1="92" y1="189.333" x2="96" y2="189.333" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="193.133" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">2</text>
  <line x1="92" y1="86" x2="96" y2="86" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="88" y="89.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">3</text>
  <text x="276" y="434" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">u</text>
  <text x="88" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">y = -log u</text>
  <polyline points="113.923,86 115.349,93.907 116.774,101.252 118.199,108.109 119.625,114.539 121.05,120.593 122.475,126.311 123.901,131.729 125.326,136.878 126.751,141.782 128.177,146.464 129.602,150.943 131.027,155.235 132.452,159.357 133.878,163.32 135.303,167.137 136.728,170.818 138.154,174.373 139.579,177.809 141.004,181.135 142.43,184.356 143.855,187.481 145.28,190.514 146.706,193.46 148.131,196.324 149.556,199.112 150.982,201.826 152.407,204.47 153.832,207.049 155.258,209.565 156.683,212.021 158.108,214.42 159.534,216.765 160.959,219.057 162.384,221.3 163.81,223.495 165.235,225.645 166.66,227.75 168.085,229.814 169.511,231.837 170.936,233.822 172.361,235.769 173.787,237.68 175.212,239.556 176.637,241.399 178.063,243.209 179.488,244.989 180.913,246.738 182.339,248.458 183.764,250.15 185.189,251.815 186.615,253.453 188.04,255.066 189.465,256.654 190.891,258.217 192.316,259.758 193.741,261.276 195.167,262.772 196.592,264.247 198.017,265.701 199.443,267.134 200.868,268.548 202.293,269.943 203.718,271.32 205.144,272.678 206.569,274.019 207.994,275.342 209.42,276.649 210.845,277.94 212.27,279.214 213.696,280.473 215.121,281.717 216.546,282.946 217.972,284.161 219.397,285.361 220.822,286.548 222.248,287.721 223.673,288.881 225.098,290.029 226.524,291.163 227.949,292.285 229.374,293.396 230.8,294.494 232.225,295.581 233.65,296.657 235.075,297.721 236.501,298.775 237.926,299.818 239.351,300.85 240.777,301.873 242.202,302.885 243.627,303.887 245.053,304.88 246.478,305.864 247.903,306.838 249.329,307.803 250.754,308.759 252.179,309.706 253.605,310.645 255.03,311.575 256.455,312.497 257.881,313.411 259.306,314.317 260.731,315.215 262.157,316.105 263.582,316.988 265.007,317.863 266.433,318.731 267.858,319.592 269.283,320.445 270.708,321.292 272.134,322.131 273.559,322.964 274.984,323.79 276.41,324.61 277.835,325.423 279.26,326.23 280.686,327.03 282.111,327.825 283.536,328.613 284.962,329.395 286.387,330.172 287.812,330.943 289.238,331.708 290.663,332.467 292.088,333.221 2