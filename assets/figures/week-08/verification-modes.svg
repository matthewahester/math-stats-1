<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img">
  <title>Four verification modes with what each one can and cannot detect</title>
  <desc>A four-row table listing re-derivation, special cases, simulation and unit checks, with a column for what each catches and a column for what each misses.</desc>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="34" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Four checks that fail for different reasons</text>
  <text x="440" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">run all four; no single one of them is decisive</text>
  <rect x="30" y="88" width="840" height="40" fill="#eef2f6"/>
  <text x="39" y="112.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Check</text>
  <text x="269" y="112.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">What it catches</text>
  <text x="569" y="112.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">What it cannot catch</text>
  <line x1="30" y1="88" x2="870" y2="88" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="39" y="152.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">1. Re-derive by a second route</text>
  <text x="269" y="152.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">dropped factors, sign slips, bad algebra</text>
  <text x="569" y="152.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">a wrong assumption used in both routes</text>
  <line x1="30" y1="128" x2="870" y2="128" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="39" y="192.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">2. Special case, boundary, limit</text>
  <text x="269" y="192.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">formulas that break at n = 1 or on an edge</text>
  <text x="569" y="192.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">an error that vanishes in the special case</text>
  <line x1="30" y1="168" x2="870" y2="168" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="39" y="232.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">3. Simulate and compare</text>
  <text x="269" y="232.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">wrong shape, wrong constant, visible bias</text>
  <text x="569" y="232.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">bias smaller than the Monte Carlo noise</text>
  <line x1="30" y1="208" x2="870" y2="208" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="39" y="272.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">4. Units, ranges, signs, limits</text>
  <text x="269" y="272.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">an area of 5 over 48, a negative variance</text>
  <text x="569" y="272.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">an error that leaves units and sign intact</text>
  <line x1="30" y1="248" x2="870" y2="248" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="288" x2="870" y2="288" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="260" y1="88" x2="260" y2="288" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="560" y1="88" x2="560" y2="288" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="88" x2="30" y2="288" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="870" y1="88" x2="870" y2="288" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="30" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">Modes one and four are cheap and catch most of what goes wrong; run them before you write any code. Mode</text>
  <text x="30" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">two is the one that finds a formula derived under conditions nobody wrote down. Mode three is the only</text>
  <text x="30" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">one that touches the sampling distribution itself, and it is also the only one with a resolution: a</text>
  <text x="30" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">simulation of R replications cannot see a bias much below two standard deviations divided by the square</text>
  <text x="30" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">root of R.</text>
  <text x="30" y="416" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start" font-style="italic">A result that survives all four is still a claim about the model you assumed.</text>
</svg>
