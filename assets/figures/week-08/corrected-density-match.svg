<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" role="img">
  <title>The same simulation under the corrected density and under the normal approximation</title>
  <desc>The corrected inverse-gamma density tracks the histogram closely, peaking near 0.42, while a dashed normal curve centred at 0.50 is symmetric, too narrow, and misses the long right tail entirely.</desc>
