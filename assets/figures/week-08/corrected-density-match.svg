  <text x="303.62" y="109.395" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">derived mean 0.625</text>
  <text x="401.52" y="133.209" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">the corrected density, in green:</text>
  <text x="401.52" y="154.047" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">inverse gamma, shape 5, scale 2.5</text>
  <text x="401.52" y="195.721" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">the normal approximation, dashed:</text>
  <text x="401.52" y="216.558" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">mean 0.500, standard deviation 0.224,</text>
  <text x="401.52" y="237.395" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">centred wrong and far too narrow</text>
  <text x="74" y="494" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Simulated standard deviation 0.3630 against the derived 0.3608; the normal curve would have said 0.2236.</text>
  <text x="74" y="513" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Agreement here is evidence at one sample size and one rate, and it checks the algebra rather than the model.</text>
  <text x="74" y="532" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The right tail the normal curve loses is the part that matters for an upper limit on the rate.</text>
</svg>
