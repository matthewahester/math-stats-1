<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 786" width="900" height="786" role="img">
  <title>A decision chain of seven questions for an unfamiliar estimation problem</title>
  <desc>Seven stacked boxes, numbered one to seven, run from what is the model down to what would a posterior add; each has a side note naming the exit it opens, and a return arrow leads from a verification box at the bottom back to the first question.</desc>
  <rect x="0" y="0" width="900" height="786" fill="#ffffff"/>
  <text x="450" y="34" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Seven questions, asked in this order</text>
  <text x="450" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">each box names the week that supplies the tool</text>
  <rect x="52" y="84" width="350" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="227" y="109" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">1. What is the model?</text>
  <text x="227" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 1: the family, and what it assumes</text>
  <rect x="440" y="88" width="412" height="50" fill="none" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="452" y="106" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Write the family and the assumptions before any symbol</text>
  <text x="452" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">for an estimator appears.</text>
  <line x1="402" y1="113" x2="440" y2="113" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="227" y1="142" x2="227" y2="153" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="227,160 230.15,153 223.85,153" fill="#1f2933"/>
  <rect x="52" y="162" width="350" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="227" y="187" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">2. What is the estimand?</text>
  <text x="227" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 1: observed target, then scientific target</text>
  <rect x="440" y="166" width="412" height="50" fill="none" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="452" y="184" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">These are two objects. Name the assumption that would</text>
  <text x="452" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">join them, or say it is missing.</text>
  <line x1="402" y1="191" x2="440" y2="191" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="227" y1="220" x2="227" y2="231" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="227,238 230.15,231 223.85,231" fill="#1f2933"/>
  <rect x="52" y="240" width="350" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="227" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">3. Is the estimand identified?</text>
  <text x="227" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 1: distinct parameters, distinct laws</text>
  <rect x="440" y="244" width="412" height="50" fill="none" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="452" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">If not, stop here. No estimator and no sample size</text>
  <text x="452" y="276" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">repairs a flat ridge.</text>
  <line x1="402" y1="269" x2="440" y2="269" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="227" y1="298" x2="227" y2="309" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="227,316 230.15,309 223.85,309" fill="#1f2933"/>
  <rect x="52" y="318" width="350" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="227" y="343" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">4. Is an exact distribution at hand?</text>
  <text x="227" y="360" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Weeks 2 to 4: transforms, order statistics, pivots</text>
  <rect x="440" y="322" width="412" height="50" fill="none" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="452" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">If yes, take it. An exact pivot beats an approximation</text>
  <text x="452" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">at every sample size.</text>
  <line x1="402" y1="347" x2="440" y2="347" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="227" y1="376" x2="227" y2="387" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="227,394 230.15,387 223.85,387" fill="#1f2933"/>
  <rect x="52" y="396" width="350" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="227" y="421" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">5. Does an asymptotic argument apply?</text>
  <text x="227" y="438" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 5: laws, the CLT, Slutsky, the delta method</text>
  <rect x="440" y="400" width="412" height="50" fill="none" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="452" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Always ask at which n it starts to hold, then say how</text>
  <text x="452" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">you would find out.</text>
  <line x1="402" y1="425" x2="440" y2="425" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="227" y1="454" x2="227" y2="465" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="227,472 230.15,465 223.85,465" fill="#1f2933"/>
  <rect x="52" y="474" width="350" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="227" y="499" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">6. What does the likelihood give?</text>
  <text x="227" y="516" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 7: score, information, the maximizer</text>
  <rect x="440" y="478" width="412" height="50" fill="none" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="452" y="496" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Check regularity first. Support that moves with theta</text>
  <text x="452" y="510" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">sends you back to step four.</text>
  <line x1="402" y1="503" x2="440" y2="503" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="227" y1="532" x2="227" y2="543" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="227,550 230.15,543 223.85,543" fill="#1f2933"/>
  <rect x="52" y="552" width="350" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="227" y="577" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">7. What would a posterior add?</text>
  <text x="227" y="594" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 9, one week ahead</text>
  <rect x="440" y="556" width="412" height="50" fill="none" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="452" y="574" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">A prior, a credible interval, and shrinkage toward</text>
  <text x="452" y="588" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">what you knew beforehand.</text>
  <line x1="402" y1="581" x2="440" y2="581" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="227" y1="610" x2="227" y2="635" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="227,642 230.15,635 223.85,635" fill="#1f2933"/>
  <rect x="52" y="644" width="350" height="58" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="227" y="669" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Now verify, four ways</text>
  <text x="227" y="686" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">re-derive, special case, simulate, check units</text>
  <rect x="440" y="648" width="412" height="50" fill="none" rx="5" stroke="#2f6f9f" stroke-width="1"/>
  <text x="452" y="666" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="start">A failed check sends you back up the chain, usually to</text>
  <text x="452" y="680" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="start">a box where an assumption went untested.</text>
  <line x1="52" y1="673" x2="26" y2="673" stroke="#2f6f9f" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="26" y1="673" x2="26" y2="113" stroke="#2f6f9f" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="26" y1="113" x2="43" y2="113" stroke="#2f6f9f" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="50,113 43,109.85 43,116.15" fill="#2f6f9f"/>
  <text x="30" y="72" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2f6f9f" text-anchor="start">return path</text>
  <text x="52" y="736" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The chain is an order, not a menu. Steps skipped early are the ones that fail late.</text>
</svg>
