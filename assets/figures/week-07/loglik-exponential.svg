<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 490" width="790" height="490" role="img">
  <title>Exponential log-likelihood with its peak and curvature marked</title>
  <desc>A single-peaked curve of log-likelihood against the rate lambda, maximized at 0.0571, with a dashed quadratic of matching curvature and a marked one-standard-error width.</desc>
