  <text x="438.767" y="365.711" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the six readings</text>
  <text x="235.083" y="230.531" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="middle">likelihood is exactly zero here:</text>
  <text x="235.083" y="252.875" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="middle">these values of theta are refuted</text>
  <text x="235.083" y="275.219" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="middle">by the reading of 1.94</text>
