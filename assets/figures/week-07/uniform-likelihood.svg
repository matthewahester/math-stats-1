<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 480" width="790" height="480" role="img">
  <title>The Uniform(0, theta) likelihood as a step that drops to zero at the largest observation</title>
  <desc>The likelihood is flat at zero up to 1.94, jumps to its maximum there, and then decays like theta to the minus six; the six observations are marked below the axis.</desc>
  <rect x="0" y="0" width="790" height="480" fill="#ffffff"/>
  <text x="395" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">The likelihood for the upper endpoint of Uniform(0, theta)</text>
  <text x="395" y="53" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">six readings, largest 1.94 volts; heights shown relative to the maximum</text>
  <text x="92" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">likelihood relative to its maximum</text>
