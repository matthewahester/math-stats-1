  <text x="487.583" y="208.187" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">no interior theta has zero slope,</text>
  <text x="487.583" y="230.531" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">so the score equation has no root</text>
  <text x="92" y="454" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The maximum sits on the boundary of the region the data allow, which is why theta hat can never overshoot.</text>
