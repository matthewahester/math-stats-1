<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" width="780" height="530" role="img">
  <title>The delta method as a tangent line carrying spread through a transformation</title>
  <desc>A logarithm curve with its tangent line at t = 2. A bell-shaped spread centred at 2 on the horizontal axis is carried through the tangent to a bell half as wide, centred at log 2, on the vertical axis.</desc>
  <rect x="0" y="0" width="780" height="530" fill="#ffffff"/>
  <text x="390" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Why the delta-method variance carries a squared derivative</text>
  <text x="48" y="54" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The curve is g(t) = log t and theta = 2. Near theta the curve is almost its tangent, so a spread of size</text>
  <text x="48" y="69" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">s around theta arrives as a spread of size |g'(theta)| times s around g(theta). Squaring that factor is</text>
  <text x="48" y="84" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">what turns a variance into a variance.</text>
