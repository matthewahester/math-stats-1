  <text x="48" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">At n = 30 the strongly skewed population puts 0.069 in the upper tail and 0.0005 in the lower one. The two</text>
  <text x="48" y="447" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">errors partly cancel in a two-sided statement, which is how a badly wrong pair of tails hides behind</text>
  <text x="48" y="462" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">respectable-looking two-sided coverage. What governs the gap is n divided by the squared skewness, not n</text>
  <text x="48" y="477" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">on its own.</text>
