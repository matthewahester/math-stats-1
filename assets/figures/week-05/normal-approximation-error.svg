<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" width="780" height="510" role="img">
  <title>Actual tail probability of a nominal five percent normal tail against sample size</title>
  <desc>Two panels. In the upper-tail panel both curves sit above the nominal 0.050 line, and the strongly skewed population is still above 0.060 at n = 200. In the lower-tail panel the strongly skewed population is near zero until about n = 40 and is still short of 0.050 at n = 200.</desc>
  <rect x="0" y="0" width="780" height="510" fill="#ffffff"/>
  <text x="390" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">How wrong the normal approximation is, tail by tail</text>
  <text x="48" y="54" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Two gamma populations, both handled exactly because a sum of gamma variables is again gamma. Skewness 2 is</text>
  <text x="48" y="69" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">the exponential; skewness 6.3 is a gamma with shape 0.1. The normal approximation promises 0.050 in each</text>
  <text x="48" y="84" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">tail beyond 1.645 standard errors.</text>
