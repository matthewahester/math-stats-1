<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 540" width="830" height="540" role="img">
  <title>Variance against sample size with the Cramer-Rao floor beneath</title>
  <desc>Three falling curves against sample size: the Cramer-Rao floor lowest, the variance of the unbiased rate estimator just above it, and the mean squared error of the maximum likelihood estimator above that; all three converge as n grows.</desc>
  <rect x="0" y="0" width="830" height="540" fill="#ffffff"/>
  <text x="415" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">The floor, and two estimators of an exponential rate above it</text>
  <text x="415" y="53" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">everything in units of lambda squared, so the picture holds at every true rate</text>
  <text x="78" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">variance or mean squared error</text>
  <line x1="78" y1="394" x2="548" y2="394" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="94" x2="78" y2="394" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="394" x2="548" y2="394" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="346.381" x2="548" y2="346.381" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
