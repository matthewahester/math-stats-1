<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 642" width="760" height="642" role="img">
  <title>A bootstrap distribution with its percentile cuts</title>
  <desc>A right-skewed histogram of four thousand bootstrap rate estimates centred near 0.43, with dashed cuts at the 2.5 and 97.5 percentiles and, below, the bootstrap interval drawn against the exact interval.</desc>
  <rect x="0" y="0" width="760" height="642" fill="#ffffff"/>
  <text x="40" y="32" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">The fourth machine: resample, recompute, read off percentiles</text>
  <text x="40" y="54" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Four thousand resamples of twelve failure times, each giving a fresh rate estimate.</text>
  <text x="40" y="71" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The estimate from the observed data is 0.400 per hour.</text>
