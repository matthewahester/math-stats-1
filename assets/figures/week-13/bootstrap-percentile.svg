  <rect x="641.176" y="333.602" width="14.706" height="2.398" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="655.882" y="334.561" width="14.706" height="1.439" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="670.588" y="333.602" width="14.706" height="2.398" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="685.294" y="335.041" width="14.706" height="0.959" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <line x1="263.551" y1="100" x2="263.551" y2="336" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="552.941" y1="100" x2="552.941" y2="336" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="347.059" y1="130" x2="347.059" y2="336" stroke="#a33a3a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="354.059" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start" font-weight="bold">estimate 0.400</text>
  <text x="257.551" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="end">2.5 percent</text>
  <text x="257.551" y="141" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="end" font-weight="bold">0.258</text>
  <text x="558.941" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">97.5 percent</text>
  <text x="558.941" y="141" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold">0.750</text>
  <text x="576.471" y="253.4" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">long right tail</text>
  <text x="198" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">count of resamples</text>
  <line x1="263.551" y1="422" x2="552.941" y2="422" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="263.551" y1="417" x2="263.551" y2="427" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="552.941" y1="417" x2="552.941" y2="427" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="347.059,418.5 350.559,422 347.059,425.5 343.559,422" fill="#2f6f9f"/>
  <line x1="233.345" y1="444" x2="497.687" y2="444" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="233.345" y1="439" x2="233.345" y2="449" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="497.687" y1="439" x2="497.687" y2="449" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="347.059,440.5 350.559,444 347.059,447.5 343.559,444" fill="#3f7a52"/>
  <text x="190" y="426" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="end" font-weight="bold">bootstrap percentile</text>
  <text x="190" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="end" font-weight="bold">exact chi-square</text>
  <text x="40" y="500" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">The resampled estimates pile up to the left and trail away to the right, so the two percentile</text>
  <text x="40" y="517" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">cuts sit at unequal distances from 0.400. That asymmetry is the point of the picture: this</text>
  <text x="40" y="534" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">machine reads the shape off the data rather than assuming it. Seventeen of the four thousand</text>
  <text x="40" y="551" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">resamples landed above 1.00 and are off the axis.</text>
  <text x="40" y="573" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The bootstrap bar and the exact bar are close but not the same, and the bootstrap bar sits</text>
  <text x="40" y="590" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">higher. Why the plain percentile rule shifts in the direction it does, and how to correct it, is</text>
  <text x="40" y="607" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">among the first things the next course takes up.</text>
</svg>
