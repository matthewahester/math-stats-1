  <line x1="200" y1="100" x2="200" y2="336" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="229.412" y1="336" x2="229.412" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="229.412" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.20</text>
  <line x1="288.235" y1="336" x2="288.235" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="288.235" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.30</text>
  <line x1="347.059" y1="336" x2="347.059" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="347.059" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.40</text>
  <line x1="405.882" y1="336" x2="405.882" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="405.882" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.50</text>
  <line x1="464.706" y1="336" x2="464.706" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="464.706" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.60</text>
  <line x1="523.529" y1="336" x2="523.529" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="523.529" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.70</text>
  <line x1="582.353" y1="336" x2="582.353" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="582.353" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.80</text>
  <line x1="641.176" y1="336" x2="641.176" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="641.176" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.90</text>
  <line x1="700" y1="336" x2="700" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="700" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1.00</text>
  <text x="450" y="374" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">resampled rate estimate, per hour</text>
  <rect x="200" y="336" width="14.706" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="214.706" y="336" width="14.706" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
